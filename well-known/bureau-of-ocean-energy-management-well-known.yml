method: probed
source: live probes 2026-09-05 of every host this record knows — the registrable domain
  boem.gov and www.boem.gov, the gis.boem.gov ArcGIS Server host that serves the OGC
  WMS/WFS contracts, the two MarineCadastre hosts and the esp-boem ArcGIS Hub host.
note: |
  ONE real document exists on the whole BOEM estate: an RFC 9116 security.txt served from
  www.boem.gov (and boem.gov, which redirects to it). It is SERVED BUT EXPIRED — the file
  carries `Expires: 2025-12-01T08:00:00.000Z`, which fell due nine months before this probe.
  RFC 9116 says a client SHOULD NOT use an expired file; BOEM should reissue it.

  CAUTION on marinecadastre.gov: that host is an Esri ArcGIS Hub single-page app and answers
  HTTP 200 with the SAME 61,654-byte HTML shell for EVERY unknown path. Its `.well-known`,
  /apis.json, agent-card and llms.txt "200"s are NOT documents — they are the SPA catch-all.
  Every one is recorded below as status 200 with real: false so a later round cannot mistake
  them for hits. hub.marinecadastre.gov, by contrast, returns honest 404s.

  No OpenID/OAuth discovery, no api-catalog, no ai-plugin, no apis.json, no AAuth resource
  document and no A2A agent card exists anywhere on the estate. All public BOEM data surfaces
  are anonymous, so there is no authorization server to describe.
