source: >-
  live anonymous probes 2026-09-05 of https://gis.boem.gov/server/rest/services,
  the OGC WMS/WFS endpoints under /server/services/, https://hub.marinecadastre.gov/data.json
  and https://esp-boem.hub.arcgis.com/data.json
note: |
  BOEM's public data surfaces require NO authentication. Every probe below was made anonymously
  with no key, no token and no cookie, and every one returned data. There is no developer
  portal, no signup, no API key issuance and no OAuth authorization server anywhere on the
  estate — /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  returned 404 on all six hosts probed (see well-known/).

  The ArcGIS Server directory does advertise a login and a token endpoint
  (https://gis.boem.gov/server/rest/login and https://gis.boem.gov/server/tokens/). These are
  the stock Esri ArcGIS Server administrative surfaces, not a consumer credential path — they
  exist to let BOEM staff publish services, and nothing in BOEM's own documentation offers a
  reader an account. They are recorded here so a later round does not read them as a public
  auth tier.
