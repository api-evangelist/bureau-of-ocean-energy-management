note: |
  REPLACES A SCAFFOLD. Until this pass this file carried three invented tiers — a "Free"
  tier at 1,000 requests/month, a "Professional" tier at 100,000 with a "TBD" overage price,
  and an "Enterprise" tier with a named account manager. None of that exists. It was written
  by the 2026-05-04 bulk sweep and stamped `method: generated`; it is removed here rather than
  left to be read as BOEM's pricing.

  THE TRUTH: BOEM publishes no plans, no tiers, no pricing and no metering of any kind for its
  data services. There is no signup, no API key, no account and no paid tier. Every surface
  answered an anonymous request on 2026-09-05. As a US federal agency BOEM's public data is
  released as US Government work in the public domain; its own copyright page states the
  material is generally not copyrighted and may be used freely with credit.

  The "Fees for Services" page on boem.gov concerns procurement and FOIA-style cost recovery
  for agency services, not API or data access, and is not a pricing page.
