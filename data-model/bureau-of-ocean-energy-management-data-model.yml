relationships:
  - from: BOEM OCS Lease Blocks
    to: BOEM OCS Protraction Diagrams & Leasing Maps
    kind: belongs_to
    via: BLOCK_NUMBER within a protraction diagram
    confidence: high
    evidence: >-
      the cadastral hierarchy BOEM publishes — a protraction diagram is subdivided into lease
      blocks, and BLOCK_NUMBER is carried as a string attribute on the boundary layers
  - from: BOEM Oil and Gas Leases
    to: BOEM OCS Lease Blocks
    kind: belongs_to
    via: leased blocks
    confidence: high
  - from: BOEM Block Aliquots
    to: BOEM OCS Lease Blocks
    kind: belongs_to
    via: aliquot subdivision of a block
    confidence: high
    evidence: MMC_Layers publishes Block Aliquots (id 12) alongside Lease Blocks (id 11)
  - from: OCS Oil and Natural Gas Wells
    to: BOEM Oil and Gas Leases
    kind: belongs_to
    via: spatial containment (a well sits inside a leased block)
    confidence: medium
    note: >-
      the join is spatial, not a declared key. Use an ArcGIS query with geometry/geometryType
      or a WFS bbox filter; no attribute foreign key is exposed.
  - from: OCS Drilling Platforms
    to: OCS Oil & Gas Pipelines
    kind: has_many
    via: spatial connectivity
    confidence: low
    note: >-
      no topology or attribute link is published. Recorded as low confidence deliberately —
      this relationship is inferred from the domain, not from the contract.
