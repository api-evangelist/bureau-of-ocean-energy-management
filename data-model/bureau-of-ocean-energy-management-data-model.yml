generated: '2026-09-05'
method: derived
source: >-
  derived from the live ArcGIS REST service and layer documents at
  https://gis.boem.gov/server/rest/services (probed 2026-09-05) and the eleven OGC
  GetCapabilities documents saved verbatim in openapi/
note: |
  There is no $ref graph to walk here — BOEM's contract is OGC/Esri, not OpenAPI, so the entity
  model is the LAYER SET, and the relationships are spatial and cadastral rather than
  foreign-key. What follows is the real, enumerated layer inventory of the six public map
  services, plus the shared entities that recur across regions.

  The organising fact: BOEM publishes ONE conceptual model replicated across five OCS regions
  (Alaska, Atlantic, Gulf of America, Pacific, and the Marine Minerals composite). Seven
  entities appear in every region — wells, platforms, pipelines, the OCSLA 8(g) limit, the
  Submerged Lands Act boundary, protraction diagrams, lease blocks, leases and planning areas.
  A consumer that models one region models them all; only the region prefix changes.

  Layer ids are NOT contiguous and are NOT portable across services. 'BOEM Oil and Gas Leases'
  is id 6 in AK_Layers, id 7 in GOA_Layers and POC_Layers, and id 15 in MMC_Layers — and does
  not exist at all in ATL_Layers. Address layers by name resolved from the MapServer document,
  never by a hard-coded id.
identifiers:
  primary_key: OBJECTID (esriFieldTypeOID) on every feature layer
  geometry_field: SHAPE
  note: >-
    OBJECTID is an Esri row id, stable only within one layer of one service. It is not a BOEM
    business identifier. The real cadastral keys are BLOCK_NUMBER, protraction and lease
    identifiers carried as string attributes.
  example_schema:
    layer: BOEM_BSEE/ATL_Layers/MapServer/0 (BOEM Limit of OCSLA 8(g) zone)
    fields:
      - OBJECTID: OID
      - BDRY_APRV_DATE: String
      - BLOCK_NUMBER: String
      - BDRY_NAME_TEXT: String
      - SHAPE: Geometry
      - SHAPE.LEN: Double
